  const r={id:uid(),name,photo:b.photo||null,ak:me_.key,an:me_.name,t:Date.now()};await dbset('radios',r);return{radio:r}}
 if(seg[0]==='radios'){const r=await dbget('radios',seg[1]);if(!r)throw new Error('no_radio');const ss=()=>dball('songs').then(a=>a.filter(s=>s.rid===r.id).sort((a,b)=>a.t-b.t));
  if(m==='GET'){const s=await ss();await prep([r.photo,...s.flatMap(x=>[x.cover,x.file])]);return{radio:r,songs:s}}
  need();if(me_.key!==r.ak)throw new Error('not_yours');
  if(m==='DELETE'){for(const s of await ss())await dbdel('songs',s.id);await dbdel('radios',r.id);return{}}
  if(m==='POST'&&seg[2]==='songs'){let s;
   if(b.link){const x=await meta(String(b.link).trim());s={kind:x.kind,link:x.link,title:x.title,cover:x.cover}}
   else{if(!b.file)throw new Error('no_file');s={kind:'file',file:b.file,title:String(b.title||'—').slice(0,100),cover:null}}
   s.id=uid();s.rid=r.id;s.t=Date.now();await dbset('songs',s);return{song:s}}}
 if(m==='PUT'&&seg[0]==='songs'){need();const s=await dbget('songs',seg[1]),r=s&&await dbget('radios',s.rid);if(!r||r.ak!==me_.key)throw new Error('forbidden');s.title=String(b.title||s.title).slice(0,120);await dbset('songs',s);return{}}
 if(m==='DELETE'&&seg[0]==='songs'){need();const s=await dbget('songs',seg[1]),r=s&&await dbget('radios',s.rid);if(!r||r.ak!==me_.key)throw new Error('forbidden');await dbdel('songs',s.id);return{}}
 throw new Error('forbidden')}
/*END-LOCAL-BACKEND*/
const api=async(...a)=>{try{return await api0(...a)}catch(e){throw e instanceof TypeError?new Error(t('down')):e}};
const up=async f=>(await api('/upload',{m:'POST',b:f,h:{'x-ext':'.'+(f.name.split('.').pop()||'bin').toLowerCase()}})).file;
const FU={},F=n=>/^https?:/.test(n)?n:(FU[n]||''),vid=l=>(l.match(/v=([\w-]{11})/)||[])[1],ico=s=>s.kind==='yt'?'▶':s.kind==='sc'?'☁':'♪';
const who=(n,k)=>`<b>${esc(n)}</b>`+(k==='radiomega'?`<span class="ck">✓</span><small>${t('creator')}</small>`:'');
const th=(s,r,c='')=>{const f=(s&&s.cover)||(s&&s.kind==='yt'&&vid(s.link)&&'https://img.youtube.com/vi/'+vid(s.link)+'/hqdefault.jpg')||(r&&r.photo);return `<div class="th ${c}"${f?` style="background-image:url('${F(f)}')"`:''}>${f?'':s?ico(s):'📻'}</div>`};
const err=(t,ok)=>{const e=$('#err');if(e){e.textContent=t;e.className=ok?'err ok':'err'}};

function bar(){const p=$('#pl');if(!playing){p.style.display='none';document.body.style.paddingBottom='';return}
 const s=queue[qi];p.style.display='block';
 $('#bar').innerHTML=`${th(s,pr)}<div class="t"><div>${esc(s.title)}</div><div><small>${esc(pr.name)}</small></div></div><button data-a="skip">${t('next')}</button><button class="g" data-a="stopb">■</button>`;
 document.body.style.paddingBottom=(p.offsetHeight+12)+'px'}
async function start(rid){stop();const j=await api('/radios/'+rid);if(!j.songs.length){alert(t('nosongsalert'));return}
 pr=j.radio;playing=rid;queue=j.songs;qi=Math.floor(Math.random()*queue.length);playSong()}
function loadJS(src,g,cb){if(g==='YT'){if(window.YT&&YT.Player)return cb();window.onYouTubeIframeAPIReady=cb;if(ya)return;ya=1}else if(window.SC)return cb();const s=document.createElement('script');s.src=src;if(g==='SC')s.onload=cb;document.head.appendChild(s)}
let okp=0,wt=0;const warn=()=>{$('#emb').innerHTML='<div style="padding:10px;color:#ff5a52;font-size:14px">'+esc(t('noplay'))+'</div>'};
const watch=()=>{okp=0;clearTimeout(wt);wt=setTimeout(()=>{if(!okp)warn()},9000)};
function playSong(){busy=0;clearTimeout(wt);const s=queue[qi],e=$('#emb');audio.pause();e.innerHTML='';
 if(s.kind==='file'){setupAn();try{ac.resume()}catch(x){}audio.volume=0;audio.src=F(s.file);audio.play().catch(()=>{});fadeIn()}
 else if(s.kind==='yt'){watch();loadJS('https://www.youtube.com/iframe_api','YT',()=>{e.innerHTML='<div id="ytp"></div>';new YT.Player('ytp',{width:'100%',height:'180',videoId:vid(s.link),playerVars:{autoplay:1,playsinline:1},events:{onReady:x=>{okp=1;x.target.playVideo()},onStateChange:x=>{if(x.data===0)fin()},onError:()=>warn()}})})}
 else{watch();e.innerHTML=`<iframe id="scp" width="100%" height="120" style="border:0;display:block" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(s.link)}&auto_play=true&visual=false"></iframe>`;loadJS('https://w.soundcloud.com/player/api.js','SC',()=>{const w=SC.Widget($('#scp'));w.bind(SC.Widget.Events.FINISH,fin);w.bind(SC.Widget.Events.READY,()=>{okp=1})})}
 bar();if(view==='radio')render()}
async function fin(){if(!playing||busy)return;busy=1;const rid=playing;audio.pause();$('#emb').innerHTML='';await jingle();if(playing!==rid)return;
 try{const j=await api('/radios/'+rid);queue=j.songs}catch(e){}if(!queue.length){stop();return}if(qi>=queue.length)qi=0;qi=pick();playSong()}
audio.onended=fin;
const pick=()=>{if(queue.length<2)return 0;let n;do n=Math.floor(Math.random()*queue.length);while(n===qi);return n};
let an=null,buf=null;
function setupAn(){if(an||!/^https?:/.test(location.protocol))return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(audio);an=ac.createAnalyser();an.fftSize=512;src.connect(an);an.connect(ac.destination);buf=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}
function fadeIn(){let v=0;const iv=setInterval(()=>{v+=.1;try{audio.volume=Math.min(1,v)}catch(e){}if(v>=1)clearInterval(iv)},150)}
audio.ontimeupdate=()=>{const s=queue[qi];if(!playing||!s||s.kind!=='file'||!audio.duration)return;const left=audio.duration-audio.currentTime;if(left<2.5){try{audio.volume=Math.max(0,left/2.5)}catch(e){}}};
// анимация баса: у файлов считается по реальному звуку, у YouTube/SoundCloud (чужой плеер) — имитация
function draw(){requestAnimationFrame(draw);if(!playing)return;const cv=$('#viz'),x=cv.getContext('2d'),w=cv.width=cv.clientWidth,hh=cv.height=cv.clientHeight,s=queue[qi],N=33,v=[];
 if(s&&s.kind==='file'&&an){an.getByteFrequencyData(buf);for(let i=0;i<N;i++)v[i]=Math.pow(buf[i]/255,1.4)}
 else{const t=performance.now()/1000,beat=Math.pow(Math.abs(Math.sin(t*4.2)),3);for(let i=0;i<N;i++)v[i]=Math.min(1,beat*(1-i/N)*.9+Math.random()*.25*(1-i/N))}
 const bass=(v[0]+v[1]+v[2]+v[3])/4,bw=w/N;x.clearRect(0,0,w,hh);
 for(let i=0;i<N;i++){const a=v[Math.abs(i-16)],bh=Math.max(3,a*hh);x.fillStyle=Math.abs(i-16)<4?'#ff2a1f':'#e10600';x.fillRect(i*bw+2,hh-bh,bw-4,bh)}
 const t=$('#bar .th');if(t)t.style.transform=`scale(${1+bass*.28})`}
draw();
function stop(){playing=null;busy=0;clearTimeout(wt);audio.pause();audio.removeAttribute('src');$('#emb').innerHTML='';$('#jg').classList.remove('on');try{speechSynthesis.cancel()}catch(e){}bar();if(view==='radio')render()}
function jingle(){return new Promise(res=>{const j=$('#jg'),T=$('#jt');j.classList.add('on');
 const fr=['T','TT','TTT','TTTT','TTTTT','TTTTT NE','TTTTT NEXT','NEXT S','NEXT SSS','NEXT SSSSOOO','NEXT SSSSOOOOONG'];let i=0;T.textContent=fr[0];
 const iv=setInterval(()=>{i++;if(i<fr.length)T.textContent=fr[i];else clearInterval(iv)},120);
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime,n=ac.sampleRate*1.2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let k=0;k<n;k++)d[k]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3500,t+1);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);
  [[659.25,1],[880,1.15],[1318.5,1.3]].forEach(([fq,at])=>{const o=ac.createOscillator(),og=ac.createGain();o.type='triangle';o.frequency.value=fq;og.gain.setValueAtTime(.0001,t+at);og.gain.exponentialRampToValueAtTime(.3,t+at+.02);og.gain.exponentialRampToValueAtTime(.0001,t+at+.7);o.connect(og);og.connect(ac.destination);o.start(t+at);o.stop(t+at+.8)})}catch(e){}
 setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(t('say'));u.lang=SP[LI];u.rate=.95;u.pitch=.7;speechSynthesis.speak(u)}catch(e){}},600);
 setTimeout(()=>{clearInterval(iv);j.classList.remove('on');res()},3000)})}

async function load(){try{const{radios}=await api('/radios?q='+encodeURIComponent(qv));
 $('#list').innerHTML=radios.map((r,i)=>`<div class="st" data-a="open" data-id="${r.id}"><div class="n">${String(i+1).padStart(2,'0')}</div>${th(null,r)}<div><div class="nm">${esc(r.name)}</div><div class="au">${who(r.an,r.ak)}</div></div></div>`).join('')||`<p class="mu">${t('none')}</p>`}catch(e){$('#list').textContent=tr(e.message)}}
async function render(){const app=$('#app');
 $('#user').innerHTML=me?`<span class="av">${esc(me.name[0].toUpperCase())}${me.key==='radiomega'?'<i>✓</i>':''}</span><span>${who(me.name,me.key)}</span><button class="g" data-a="out">${t('logout')}</button>`:`<button data-a="auth">${t('login')}</button>`;
 $('#user').insertAdjacentHTML('beforeend',`<button class="g" data-a="lang">🌐 ${(lang||'en').toUpperCase()}</button>`);
 if(view==='lang')app.innerHTML=`<div class="box s"><h2>Language · Язык</h2><br>${LN.map((c,i)=>`<button style="display:block;width:100%;margin:6px 0" data-a="setlang" data-id="${c}">${NAMES[i]}</button>`).join('')}</div>`;
 else if(view==='auth')app.innerHTML=`<div class="box s"><h2>${t('account')}</h2><br><input type="text" id="un" placeholder="${t('name')}" maxlength="20"><input type="password" id="pw" placeholder="${t('pass')}"><div class="err" id="err"></div><button data-a="login">${t('login')}</button> <button class="g" data-a="reg">${t('newacc')}</button></div>`;
 else if(view==='new')app.innerHTML=`<div class="box s"><h2>${t('newradio')}</h2><p class="mu">${t('limit')}</p><input type="text" id="rn" placeholder="${t('radioname')}" maxlength="40"><p class="mu">${t('photo')}</p><input type="file" id="ph" accept="image/*"><div class="err" id="err"></div><br><button data-a="create">${t('make')}</button> <button class="g" data-a="home">${t('cancel')}</button></div>`;
 else if(view==='radio'){let j;try{j=await api('/radios/'+cur)}catch(e){view='home';return render()}
  const r=j.radio,own=me&&me.key===r.ak;
  app.innerHTML=`<button class="g" data-a="home">${t('back')}</button><div class="hero">${th(null,r,'big')}<div><h2>${esc(r.name)}</h2><div class="au">${who(r.an,r.ak)}</div><br><button data-a="play">${playing===r.id?t('stop'):t('listen')}</button></div></div>
  ${own?`<div class="box"><label class="b">${t('addfile')}<input type="file" accept="audio/*" multiple hidden id="songs"></label> <button class="g" data-a="delr">${t('delradio')}</button><p class="mu">${t('linkhint')}</p><input type="text" id="ln" placeholder="https://..."><button data-a="addlink">${t('addlink')}</button><div class="err" id="err"></div></div>`:`<p class="mu">${t('owneronly')}</p>`}
  <div>${!own?`<p class="mu">${t('onair')}${j.songs.length}. ${t('onair2')}</p>`:j.songs.map(s=>`<div class="sg">${th(s,r)}<div class="t"><div${own?` data-a="ren" data-id="${s.id}" style="cursor:pointer" title="✎"`:''}>${esc(s.title)}</div><small>${s.kind==='yt'?'youtube':s.kind==='sc'?'soundcloud':t('file')}${playing===r.id&&queue[qi]&&queue[qi].id===s.id?' ▶':''}</small></div>${own?`<button class="g" data-a="dels" data-id="${s.id}">✕</button>`:''}</div>`).join('')||`<p class="mu">${t('nosongs')}</p>`}</div>`}
 else{app.innerHTML=`<div class="row"><h2>${t('stations')}</h2><button data-a="new">${t('create')}</button></div><input type="text" id="q" placeholder="${t('search')}" value="${esc(qv)}"><div id="list"></div>`;load()}}
document.addEventListener('input',e=>{if(e.target.id==='q'){qv=e.target.value;clearTimeout(qt);qt=setTimeout(load,250)}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 try{
 if(a==='home')view='home';
 else if(a==='open'){view='radio';cur=id}
 else if(a==='lang')view='lang';
 else if(a==='setlang'){lang=id;LI=LN.indexOf(id);localStorage.setItem('rm_lang',id);document.documentElement.lang=id;view='home';bar()}
 else if(a==='new')view=me?'new':'auth';
 else if(a==='auth')view='auth';
 else if(a==='out'){me=null;tk='';localStorage.removeItem('rm_tk');view='home'}
 else if(a==='reg'||a==='login'){const j=await api(a==='reg'?'/register':'/login',{m:'POST',j:{name:$('#un').value,pw:$('#pw').value}});tk=j.token;me=j.me;localStorage.setItem('rm_tk',tk);view='home'}
 else if(a==='create'){const f=$('#ph').files[0];await api('/radios',{m:'POST',j:{name:$('#rn').value,photo:f?await up(f):null}});view='home'}
 else if(a==='addlink'){err(t('finding'),1);await api(`/radios/${cur}/songs`,{m:'POST',j:{link:$('#ln').value}})}
 else if(a==='play'){if(playing===cur)stop();else await start(cur)}
 else if(a==='skip'){fin();return}
 else if(a==='stopb'){stop();return}
 else if(a==='ren'){const nt=(prompt(t('rename'),el.textContent)||'').trim();if(!nt)return;await api('/songs/'+id,{m:'PUT',j:{title:nt.slice(0,120)}})}
 else if(a==='dels')await api('/songs/'+id,{m:'DELETE'});
 else if(a==='delr'){if(!confirm(t('confirmdel')))return;if(playing===cur)stop();await api('/radios/'+cur,{m:'DELETE'});view='home'}
 }catch(x){err(tr(x.message));return}
 render()});
document.addEventListener('change',async e=>{if(e.target.id==='songs'){try{for(const f of e.target.files){err(t('uploading')+f.name+'…',1);await api(`/radios/${cur}/songs`,{m:'POST',j:{file:await up(f),title:f.name.replace(/\.[^.]+$/,'')}})}}catch(x){err(tr(x.message));return}render()}});
(async()=>{try{await init0()}catch(e){document.body.insertAdjacentHTML('afterbegin','<p style="color:#ff5a52;padding:10px">IndexedDB unavailable (private mode?)</p>')}try{me=(await api('/me')).me}catch(e){}document.documentElement.lang=lang||'en';if(!lang)view='lang';render()})();
