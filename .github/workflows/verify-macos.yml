name: macOS source verification
on:
  push:
    branches: ['check/macos-011']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Build and test the published ZIP
        env:
          SOURCE_URL: https://mirwaqi.github.io/Real.Island/Real.Island-Apple-0.1.3-Source.zip
        run: |
          curl --fail --silent --show-error --location "$SOURCE_URL" --output source.zip
          echo 'd8e9baa42110242be8b2edee005337f02e116b84b85a73165a978fc64ba05b2e  source.zip' | shasum -a 256 -c
          unzip -q source.zip
          set +e
          bash real-island-apple/build.sh > build.log 2>&1
          build_status=$?
          cat build.log
          grep -Ei 'error:|failure|failed|executed|test run with' build.log | sort -u | head -30 | while IFS= read -r problem; do
            echo "::notice::$problem"
          done
          exit "$build_status"
      - name: Verify disk image and launch the app
        run: |
          image="$PWD/real-island-apple/dist/Real.Island Apple.dmg"
          mount="$(mktemp -d)"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            hdiutil detach "$mount" >/dev/null 2>&1 || true
            rmdir "$mount"
          }
          trap cleanup EXIT
          hdiutil verify "$image"
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
          app="$mount/Real.Island Apple.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/codesign -dv "$app" 2>&1 | grep '^Signature='
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$version" = 0.1.3
          /usr/bin/lipo -verify_arch arm64 "$app/Contents/MacOS/RealIslandApple"
          echo "::notice::Verified DMG integrity, arm64 app, version 0.1.3 and valid ad hoc signature."
          open -n "$app"
          for attempt in {1..10}; do
            pid="$(pgrep -x RealIslandApple || true)"
            [[ -n "$pid" ]] && break
            sleep 1
          done
          test -n "$pid"
          sleep 12
          kill -0 "$pid"
          echo "::notice::Launch Services started Real.Island Apple and the same process stayed alive for 12 seconds."
