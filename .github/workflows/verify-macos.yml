name: macOS source verification
on:
  push:
    branches: ['check/macos-011']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Build and test the candidate ZIP
        env:
          SOURCE_URL: https://raw.githubusercontent.com/mirwaqi/Real.Island/check/macos-011/Real.Island-Apple-0.1.8-Source.zip
        run: |
          curl --fail --silent --show-error --location "$SOURCE_URL" --output source.zip
          echo '2bb46a3e8058ce8a96088ce27bae58eeef3daf9f2d1c83cf2c45c557b1fb78cc  source.zip' | shasum -a 256 -c
          unzip -q source.zip
          set +e
          bash real-island-apple/build.sh > build.log 2>&1
          build_status=$?
          cat build.log
          grep -Ei 'error:|failure|failed|executed|test run with' build.log | sort -u | head -30 | while IFS= read -r problem; do
            echo "::notice::$problem"
          done
          exit "$build_status"
      - name: Open the app and capture its real window
        run: |
          trap 'echo "::error::macOS smoke test stopped at: $BASH_COMMAND"' ERR
          image="$PWD/real-island-apple/dist/Real.Island Apple.dmg"
          mount="$(mktemp -d)"
          app_path="$mount/Real.Island Apple.app"
          hdiutil verify "$image"
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
          /usr/bin/codesign --verify --deep --strict "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = 0.1.8
          test "$(/usr/bin/lipo -archs "$app_path/Contents/MacOS/RealIslandApple")" = arm64
          echo "::notice::Verified DMG integrity, arm64 app, version 0.1.8 and valid ad hoc signature."
          open -n "$app_path"
          pid=""
          for attempt in {1..10}; do
            pid="$(pgrep -x RealIslandApple || true)"
            [[ -n "$pid" ]] && break
            sleep 1
          done
          test -n "$pid"
          sleep 5
          kill -0 "$pid"
          echo "::notice::Launch Services started the actual Real.Island Apple app."
          cat > find-window.swift <<'SWIFT'
          import CoreGraphics
          let owner = Int(CommandLine.arguments[1])!
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
              as? [[String: Any]] ?? []
          let island = windows.first {
              guard ($0[kCGWindowOwnerPID as String] as? Int) == owner,
                    let bounds = $0[kCGWindowBounds as String] as? [String: CGFloat],
                    let width = bounds["Width"], let height = bounds["Height"] else { return false }
              let mode = CommandLine.arguments.last
              switch mode {
              case "expanded", "click-settings": return width == 276 && height == 74
              case "settings": return width == 346 && height == 235
              case "reminders": return width == 346 && height == 254
              case "playing": return width == 556 && height == 72
              case "banner": return width == 276 && height == 62
              default: return width == 160 && height == 22
              }
          }
          if let id = island?[kCGWindowNumber as String] as? Int {
              if ["click", "click-settings"].contains(CommandLine.arguments.last ?? ""),
                 let bounds = island?[kCGWindowBounds as String] as? [String: CGFloat],
                 let x = bounds["X"], let y = bounds["Y"], let width = bounds["Width"], let height = bounds["Height"] {
                  let center = CommandLine.arguments.last == "click-settings"
                      ? CGPoint(x: x + width - 30, y: y + 48)
                      : CGPoint(x: x + width / 2, y: y + height / 2)
                  CGEvent(mouseEventSource: nil, mouseType: .leftMouseDown, mouseCursorPosition: center, mouseButton: .left)?
                      .post(tap: .cghidEventTap)
                  CGEvent(mouseEventSource: nil, mouseType: .leftMouseUp, mouseCursorPosition: center, mouseButton: .left)?
                      .post(tap: .cghidEventTap)
              } else { print(id) }
          }
          SWIFT
          window="$(xcrun swift find-window.swift "$pid")"
          test -n "$window"
          echo "::notice::Window Server reports an on-screen Real.Island Apple panel."
          mkdir -p captures
          screencapture -x -o -l "$window" captures/Real.Island-Apple-0.1.8.png
          test -s captures/Real.Island-Apple-0.1.8.png
          xcrun swift find-window.swift "$pid" click
          sleep 2
          expanded="$(xcrun swift find-window.swift "$pid" expanded)"
          if [[ -n "$expanded" ]]; then
            screencapture -x -o -l "$expanded" captures/Real.Island-Apple-0.1.8-expanded.png
            echo "::notice::Clicking the compact clock opened the actual app."
            xcrun swift find-window.swift "$pid" click-settings
            sleep 2
            settings="$(xcrun swift find-window.swift "$pid" settings)"
            if [[ -n "$settings" ]]; then
              screencapture -x -o -l "$settings" captures/Real.Island-Apple-0.1.8-settings.png
              echo "::notice::The settings button opened the actual settings panel."
            else
              echo "::warning::The runner could not open settings with a synthetic click."
            fi
          else
            echo "::warning::The runner could not verify expanding the panel with a synthetic click."
          fi
          test -s captures/Real.Island-Apple-0.1.8-expanded.png
          test -s captures/Real.Island-Apple-0.1.8-settings.png
          kill "$pid"
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path("real-island-apple/Sources/RealIslandApple/main.swift")
          text = source.read_text()
          marker = "        configureMenu()"
          assert text.count(marker) == 1
          fixture = """
                  if CommandLine.arguments.contains("--sample-editor") {
                      model.open(.reminders)
                  } else if CommandLine.arguments.contains("--sample-reminder") {
                      let now = Date.now
                      precondition(model.addReminder(title: "Полить растения", date: now.addingTimeInterval(1)))
                      model.refreshReminders(now: now)
                      precondition(model.reminderNotice == nil && model.reminders.count == 1)
                      model.refreshReminders(now: now.addingTimeInterval(2))
                      precondition(model.reminderNotice?.title == "Полить растения" && model.reminders.isEmpty)
                  } else {
                  model.track = Track(player: .music, title: "Ночной эфир",
                                      artist: "Тестовый трек", isPlaying: true, artwork: nil)
                  model.levels = [0.36, 0.80, 0.62, 0.38, 0.24]
                  lastAudioFrame = ProcessInfo.processInfo.systemUptime + 60
                  model.open(.music)
                  }
          """
          source.write_text(text.replace(marker, marker + fixture))
          PYTHON
          binary_dir="$(cd real-island-apple && xcrun swift build -c release --arch arm64 --show-bin-path)"
          (cd real-island-apple && xcrun swift build -c release --arch arm64)
          fixture_app="$PWD/Playback Capture.app"
          ditto "$app_path" "$fixture_app"
          install -m 755 "$binary_dir/RealIslandApple" "$fixture_app/Contents/MacOS/RealIslandApple"
          codesign --force --sign - "$fixture_app"
          open -n "$fixture_app"
          for attempt in {1..10}; do
            pid="$(pgrep -x RealIslandApple || true)"
            [[ -n "$pid" ]] && break
            sleep 1
          done
          test -n "$pid"
          sleep 2
          playing="$(xcrun swift find-window.swift "$pid" playing)"
          test -n "$playing"
          screencapture -x -o -l "$playing" captures/Real.Island-Apple-0.1.8-playback.png
          echo "::notice::Captured the music notch and side card using test track and signal data."
          kill "$pid"
          sleep 1
          open -n "$fixture_app" --args --sample-editor
          sleep 2
          pid="$(pgrep -x RealIslandApple)"
          editor="$(xcrun swift find-window.swift "$pid" reminders)"
          test -n "$editor"
          screencapture -x -o -l "$editor" captures/Real.Island-Apple-0.1.8-reminders.png
          kill "$pid"
          sleep 1
          open -n "$fixture_app" --args --sample-reminder
          sleep 2
          pid="$(pgrep -x RealIslandApple)"
          banner="$(xcrun swift find-window.swift "$pid" banner)"
          test -n "$banner"
          screencapture -x -o -l "$banner" captures/Real.Island-Apple-0.1.8-banner.png
          echo "::notice::Verified the scheduled reminder matured and captured its banner."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real-Island-Apple-actual-window
          path: captures/*.png
          if-no-files-found: error
