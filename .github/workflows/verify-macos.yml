name: macOS source verification
on:
  push:
    branches: ['check/macos-011']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Build the ZIP distributed on GitHub Pages
        env:
          SOURCE_URL: https://mirwaqi.github.io/Real.Island/Real.Island-Apple-0.1.1-Source.zip
        run: |
          curl --fail --silent --show-error --location "$SOURCE_URL" --output source.zip
          echo '79611aa2412ef6427f5a59f38315df691241376aeeec7b6ae8efdb12f3de2614  source.zip' | shasum -a 256 -c
          unzip -q source.zip
          bash real-island-apple/build.sh
