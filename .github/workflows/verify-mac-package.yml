name: Verify published Mac application
on:
  push:
    branches: ['check/mac-zip-100']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 6
    steps:
      - name: Download and verify the published app
        run: |
          curl --fail --silent --show-error --location --retry 2             https://github.com/mirwaqi/Real.Island/releases/download/mac-v1.0.0/Real.Island-Mac-site-candidate.zip             --output Real.Island-Mac.zip
          echo '0fbe657823eb9ec3b275e288b6d99d73941f6d8320438cc2b2e871466146bb04  Real.Island-Mac.zip' | shasum -a 256 -c
          mkdir -p app
          ditto -x -k Real.Island-Mac.zip app
          bundle="$PWD/app/Real Island.app"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$bundle"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
          mkdir -p repaired check
          ditto -c -k --sequesterRsrc --keepParent "$bundle" repaired/Real.Island-Mac-1.0.0.zip
          ditto -x -k repaired/Real.Island-Mac-1.0.0.zip check
          bundle="$PWD/check/Real Island.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
          shasum -a 256 repaired/Real.Island-Mac-1.0.0.zip
          echo "::notice::Full bundle code signature verified."
          assessment="$(spctl --assess --type execute --verbose=2 "$bundle" 2>&1)" || true
          while IFS= read -r line; do
            echo "::notice::Gatekeeper: $line"
          done <<< "$assessment"
          open -n "$bundle"
          for attempt in {1..10}; do
            pid="$(pgrep -f "$bundle/Contents/MacOS/Electron" | head -1 || true)"
            [[ -n "$pid" ]] && break
            sleep 1
          done
          test -n "$pid"
          sleep 5
          kill -0 "$pid"
          echo "::notice::The downloaded, unquarantined Mac application launched and stayed running."
      - uses: actions/upload-artifact@v4
        with:
          name: Real-Island-Mac-1.0.0-verified
          path: repaired/Real.Island-Mac-1.0.0.zip
          compression-level: 0
          if-no-files-found: error
